name: CI

on:
  push:
    paths:
      - '**.kt'
      - '**.kts'
      - '**.js'
      - 'tidyparse-cpp/**'
      - 'tidyparse-python/**'
      - 'tidyparse-wgpu/**'
      - '**.tidy'
      - '**.zip'
      - '.github/workflows/build.yml'

jobs:
  build:

    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Test supported browser projects
        run: |
          ./gradlew \
            :tidyparse-core:jsBrowserTest \
            :tidyparse-web:jsBrowserTest \
            :tidyparse-python:jsBrowserTest \
            :tidyparse-wgpu:jsBrowserTest
      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            tidyparse-core/build/reports/tests/jsBrowserTest/
            tidyparse-web/build/reports/tests/jsBrowserTest/
            tidyparse-python/build/reports/tests/jsBrowserTest/
            tidyparse-wgpu/build/reports/tests/jsBrowserTest/
